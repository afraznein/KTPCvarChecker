# KTP Tier 1 — Build-time smoke for KTPCvarChecker
#
# Note: source is `ktp_cvar.sma` (lowercase, underscore) — the only KTP
# plugin where the source filename doesn't match the repo name. Same goes
# for KTPFileChecker (`ktp_file.sma`).
#
# Implementation in KTPInfrastructure/.github/workflows/smoke-callable.yml.

name: Tier 1 Smoke

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  smoke:
    uses: ${{ github.repository_owner }}/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPCvarChecker
      under_test_kind: amx_plugin
      amxx_source: ktp_cvar.sma
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/plugins/ktp_cvar.amxx
      assert_plugin: ktp_cvar
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}
